# Merge into bitbucket-pipelines.yml in your repo.
# Pinned to the current release (security-pipeline README, "Current release").
# The step needs no repository variables and no secrets.
definitions:
  steps:
    - step: &leaa-security-scan
        name: Security Scan
        image: ghcr.io/davidvaquerizo-leadtech/security-pipeline@sha256:c20595bc2e72631b08de8188bdabda122e5583832d35a709d9d491c905bd5757
        clone:
          depth: full
        script:
          - leaa-scan
        artifacts:
          - security-reports/**

pipelines:
  pull-requests:
    '**':
      - step: *leaa-security-scan
  branches:
    main:
      - step: *leaa-security-scan
