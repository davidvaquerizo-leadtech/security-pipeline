name: CI

# Build the scanner image on both CPU types, run the gate tests inside it,
# and scan this repo with it. Publishing is a separate job that stays off
# until the board picks the registry (vars.PUBLISH_ENABLED, LEAA-2446 Q1).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: build image
        run: docker build --build-arg LEAA_VERSION="${GITHUB_SHA::12}" -t leaa-scan:test .

      - name: tool versions
        run: docker run --rm leaa-scan:test bash -c 'for t in gitleaks osv-scanner semgrep checkov zizmor actionlint uv; do printf "%-12s " "$t"; "$t" --version 2>&1 | grep -v -e "^$" -e "new version" | head -1; done'

      - name: gate tests
        run: docker run --rm -v "$PWD/tests:/tests:ro" leaa-scan:test bash /tests/run.sh

      - name: self-scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e GITHUB_ACTIONS -e GITHUB_BASE_REF \
            leaa-scan:test leaa-scan
          cat security-reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: upload self-scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports-${{ matrix.arch }}
          path: security-reports/
          retention-days: 30

  publish:
    name: publish image (gated)
    needs: build-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push to ghcr.io/<owner>/security-pipeline
      id-token: write   # keyless cosign signature (Sigstore OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push (multi-arch, SBOM + provenance)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: LEAA_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign by digest (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          cosign sign --yes "ghcr.io/${REPO}@${DIGEST}"
          {
            echo "## Published"
            echo
            echo "\`ghcr.io/${REPO}@${DIGEST}\`"
            echo
            echo "Pin this digest in the adapters."
          } >> "$GITHUB_STEP_SUMMARY"
